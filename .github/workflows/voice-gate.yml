name: voice-gate

# Brand-voice gate — offline only. Fails the build when any user-facing copy
# ships a banned word or hook anti-pattern (BRAND-VOICE §4 + §1B), enforced by
# the @recto/voice ESLint plugin + its unit tests. No browser, no server.
#
# The Playwright persona checks moved to infra.yml (manual): they serve the
# static UI and assume a populated web bundle, so they're not part of the gate.

on:
  pull_request:
    paths:
      - 'recto/**'
      - '.github/workflows/voice-gate.yml'
  push:
    branches: [main]

defaults:
  run:
    working-directory: recto

jobs:
  lint-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: recto/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Voice ESLint
        run: pnpm --filter @recto/api lint
      - name: Voice rule unit tests
        run: pnpm --filter @recto/eslint-plugin-voice test
