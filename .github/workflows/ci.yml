name: ci

# PR gate — only checks that pass offline on a fresh clone (no secrets, no
# running services). Infra tests that need `wrangler dev` + secrets live in
# infra.yml (manual). This keeps the green check honest.

on:
  pull_request:
    paths:
      - 'recto/**'
      - '.github/workflows/**'
  push:
    branches: [main]

defaults:
  run:
    working-directory: recto

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree + full history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  typecheck-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: recto/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: TypeScript strict compile
        run: pnpm --filter @recto/api typecheck
      - name: ESLint (voice + standard)
        run: pnpm --filter @recto/api lint
      - name: Unit + property + chaos vitest
        run: pnpm --filter @recto/api test
      - name: Voice plugin tests
        run: pnpm --filter @recto/eslint-plugin-voice test
