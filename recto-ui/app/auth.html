<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — recto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/components.css">
</head>
<body class="no-nav" data-page="auth">

<main style="min-height: 100vh; display: grid; place-items: center; padding: var(--s-5);">
  <div class="card" style="max-width: 420px; width: 100%;">
    <h2 style="margin-bottom: var(--s-2);">Sign in to recto.</h2>
    <p class="muted" style="margin-bottom: var(--s-5); font-size: 14px;">Enter your email and we'll send you a one-time sign-in link.</p>

    <form id="auth-form" novalidate>
      <div class="field" style="margin-bottom: var(--s-4);">
        <label class="field__label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" autocomplete="email" required data-testid="email-input" placeholder="you@yoursite.com">
      </div>
      <button class="btn btn--primary" type="submit" style="width: 100%;" data-testid="magic-link-btn">Send magic link</button>
      <p class="field__help" style="margin-top: var(--s-3);">Check your inbox. Usually under 10 seconds.</p>
    </form>
  </div>
</main>

<script src="/scripts/app-shell.js"></script>
<script src="/scripts/api.js"></script>
<script src="/scripts/pages.js"></script>
</body>
</html>
